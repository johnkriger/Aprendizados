<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/caixa.jpg" type="image/jpg">
    <title>Caixa</title>
</head>
<body>
    <img src="img/caixa.jpg" alt="Caixa de mercado">
    <h1>Caixa de loja</h1>
    <form>
        <p>Data de vencimento:
            <input type="date" id="inData" required autofocus>
        </p>
        <p>Valor da conta R$: 
            <input type="number" id="inValor" min="0" step="0.01" class="alinha-direita" required>
            <input type="submit" value="Calcular multa e juros">
        </p>
        <p>Valor da multa R$: 
            <input type="number" id="outMulta" class="alinha-direita" readonly>
        </p>
        <p>Valor dos juros R$: 
            <input type="number" id="outJuros" class="alinha-direita" readonly>
        </p>
        <p>Total a pagar R$: 
            <input type="number" id="outTotal" class="alinha-direita" readonly>
            <input type="reset" value="Nova conta">
        </p>
    </form>
    <script src="js/exe7_6.js"></script>
</body>
</html>
