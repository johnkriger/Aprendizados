<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/transito.jpg" type="image/jpg">
    <title>Multa</title>
</head>
<body>
    <img src="img/transito.jpg" alt="trânsito lento">
    <h1>Multas de trânsito</h1>
    <form>
        <p>
            Data da infração:
            <input type="date" id="inData" required autofocus>
        </p>
        <p>
            Valor da multa: 
            <input type="number" id="inValor" min="0.1" step="0.1" required>
        </p>
        <p>
            <input type="submit" value="Calcular data limite de pagamento e valor com desconto">
        </p>
    </form>
    <h3></h3>
    <script src="js/resp7_3.js"></script>
</body>
</html>
