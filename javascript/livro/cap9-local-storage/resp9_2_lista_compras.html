<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/compas.jpg" type="image/jpg">
    <title>Compras</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-3">
                <img src="img/compas.jpg" alt="Lista de compas" class="img-fluid">
            </div>
            <div class="col-sm-9">
                <h1>Lista de compras</h1>
                <form>
                    <p>
                        <label for="inProduto">Produto: </label>
                        <input type="text" id="inProduto" class="form-control" required autofocus>
                    </p>
                    <p>
                        <input type="submit" value="Adicionar" class="btn btn-primary">
                        <input type="button" value="Remover item" id="btRemover" class="btn btn-warning">
                        <input type="button" value="Limpar lista" id="btLimpar" class="btn btn-danger">
                    </p>
                </form>
                <pre></pre>
            </div>
        </div>
    </div>
    <script src="js/resp9_2.js"></script>
</body>
</html>
