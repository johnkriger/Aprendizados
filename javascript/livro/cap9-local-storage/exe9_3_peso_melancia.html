<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/melosa.jpg" type="image/jpg">
    <title>Melância</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/melosa.jpg" alt="Melância" class="img-fluid">
            </div>
            <div class="col-sm-8">
                <h1>Qual é o peso da melância?</h1>
                <form>
                    <p><label for="inNome">Nome do apostador: </label>
                        <input type="text" id="inNome" class="form-control" required autofocus></p>
                    <p><label for="inPeso">Peso (em gramas):</label>
                        <input type="text" id="inPeso" class="form-control" required></p>
                    <p><input type="submit" value="Apostar" class="btn btn-primary">
                        <input type="button" value="Vencedor" id="btVencedor" class="btn btn-warning">
                        <input type="button" value="Limpar Apostas" id="btLimpar" class="btn btn-danger"></p>
                </form>
                <pre></pre>
            </div>
        </div>
    </div>
    <script src="js/exe9_3.js"></script>
</body>
</html>
