<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/oficina.jpg" type="image/jpg">
    <title>Oficina</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/oficina.jpg" alt="Oficina" class="img-fluid">
            </div>
            <div class="col-sm-8">
                <h1>Controle de serviços</h1>
                <form>
                    <p>
                        <label for="inServico">Serviço - Veículo: </label>
                        <input type="text" id="inServico" class="form-control" required autofocus>
                    </p>
                    <p>
                        <input type="submit" value="Adicionar Serviço" class="btn btn-primary">
                        <input type="button" value="Executar Serviço" id="btExecutar" class="btn btn-dark">
                    </p>
                </form>
                <h2 class="servico">Serviços pendentes: <span></span></h2>
                <p class="execucao">Serviço em execução:</p>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/resp9_3.js"></script>
</body>
</html>
