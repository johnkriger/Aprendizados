<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/revenda-de-carros-usados.jpg" type="image/jpg">
    <title>Revenda</title>
</head>
<body>
    <img src="img/revenda-de-carros-usados.jpg" alt="revenda de carros usados" class="normal">
    <h1>Revenda trambique</h1>
    <form>
        <p>
            Modelo do veículo:
            <input type="text" id="inModelo" required autofocus>
        </p>
        <p>
            Ano de Fabricação: 
            <input type="number" id="inAno" required>
        </p>
        <p>Preço R$:
            <input type="number" min="0" step="0.1" id="inPreco" required>
        </p>
        <p>
            <input type="submit" value="Classificar - Calcular entrada e parcelas">
        </p>
    </form>
    <h3 id="outResp1"></h3>
    <h3 id="outResp2"></h3>
    <h3 id="outResp3"></h3>
    <script src="js/exe8_2.js"></script>
</body>
</html>
