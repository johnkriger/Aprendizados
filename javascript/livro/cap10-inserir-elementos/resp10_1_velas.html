<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/vela.jpg" type="image/jpg">
    <title>Velas</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/vela.jpg" alt="Velas" class="image-fluid">
            </div>
            <div class="col-sm-8" id="divVelas">
                <h1>Velas de aniversário</h1>
                <form>
                    <p>
                        <label for="inIdade">Idade:</label>
                        <input type="number" class="form-control" id="inIdade" min="0" step="1" max="120" required autofocus>
                    </p>
                    <p>
                        <input type="submit" value="Exibir Velas" class="btn btn-primary">
                        <input type="reset" value="Novas Velas" class="btn btn-danger">
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/resp10_1.js"></script>
</body>
</html>
