<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/copa-do-brasil-logo-0.png" type="image/png">
    <title>Copa do Brasil</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/copa-do-brasil-logo-0.png" alt="Logo da copa do Brasil" class="img-fluid">
            </div>
            <div class="col-sm-8">
                <h1>Copa do Brasil - Classificados</h1>
                <form>
                    <p>
                        <label for="inClubes">Clube:</label>
                        <input type="text" class="form-control" id="inClubes" required autofocus>
                    </p>
                    <p>
                        <input type="submit" value="Adicionar" class="btn btn-primary">
                        <input type="button" value="Montar tabela de jogos" id="btMontar" class="btn btn-info">
                        <input type="button" value="Novos Clubes" id="btNovo" class="btn btn-danger">
                    </p>
                </form>
                <div id="divTimes"></div>
                <table class="table table-striped" id="tbConfrontos">
                    <tr>
                        <th>Tabela de Jogos</th>
                        <th></th>
                        <th></th>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script src="js/resp10_3.js"></script>
</body>
</html>
