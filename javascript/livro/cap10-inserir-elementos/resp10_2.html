<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
    <link rel="icon" href="img/nome.jpg" type="image/jpg">
    <title>Nomes</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/nome.jpg" alt="Placa com nomes" class="img-fluid">
            </div>
            <div class="col-sm-8" id="divNome">
                <h1>Nome colorido</h1>
                <form>
                    <p>
                        <label for="inNome">Nome completo:</label>
                        <input type="text" class="form-control" id="inNome" required autofocus>
                    </p>
                    <p>
                        <input type="submit" value="Exibir partes do nome" class="btn btn-primary">
                    </p>
                </form>
                <div id="divNome"></div>
            </div>
        </div>
    </div>
    <script src="js/resp10_2.js"></script>
</body>
</html>
