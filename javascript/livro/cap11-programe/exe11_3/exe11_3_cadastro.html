<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <title>Cadastro de Palavras</title>
</head>
<body>
    <h2 class="mt-2">Cadastrar Palavras</h2>
    <form>
        <p>
            <label for="inPalavra">Palavra:</label>
            <input type="text" class="form-control" id="inPalavra" required>
        </p>
        <p>
            <label for="inDica">Dica da Palavra:</label>
            <input type="text" class="form-control" id="inDica" required>
        </p>
        <input type="submit" class="btm btn-primary" value="Cadastrar">
    </form>
    <script src="../js/exe11_3_cadastro.js"></script>
</body>
</html>
